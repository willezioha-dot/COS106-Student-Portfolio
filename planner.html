<main class="page-container">
    <h2>My Academic Planner</h2>
    <p>Use this planner to organise your assignments, studies and deadlines.</p>

    <section class="content-card">
        <h3>Add a New Task</h3>

        <form id="taskForm">
            <label for="taskInput">Task description:</label>
            <input type="text" id="taskInput" placeholder="Enter your task" required>

            <label for="taskDate">Due date:</label>
            <input type="date" id="taskDate" required>

            <button type="submit" class="btn">Add Task</button>
        </form>
    </section>

    <section class="content-card">
        <h3>My Tasks</h3>
        <ul id="taskList">
        </ul>
        <p id="emptyMessage">You have no tasks yet.</p>
    </section>
</main>
